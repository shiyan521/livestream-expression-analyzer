# 话题标签规则配置
# 用于 auto_topic_label() 函数，根据关键词匹配为话题段落自动打标签
# 规则按顺序匹配，命中即返回对应标签
# 每条规则包含: keywords (关键词列表) 和 label (标签名)
#
# 留空则所有话题使用通用标签 "话题N"
# 示例（取消注释并修改为你自己的规则）:
#
# rules:
#   - keywords: ["自我介绍", "介绍一下"]
#     label: "自我介绍"
#   - keywords: ["翻车"]
#     label: "翻车案例"
#   - keywords: ["赚钱", "挣钱"]
#     label: "赚钱讨论"
#   - keywords: ["收尾", "感谢", "今天就", "拜拜"]
#     label: "收尾总结"
#   - keywords: ["开场", "大家好", "欢迎"]
#     label: "开场暖场"

rules: []
